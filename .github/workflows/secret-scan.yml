name: Secret scan

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

jobs:
  scan:
    name: Local credential-pattern scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Scan without third-party upload
        run: bash .github/scripts/secret-scan.sh
